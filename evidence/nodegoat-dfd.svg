<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <style>
      .t{font:16px Arial,sans-serif;fill:#111}.h{font:bold 19px Arial,sans-serif;fill:#fff}
      .s{font:14px Arial,sans-serif;fill:#333}.b{fill:#dbeafe;stroke:#1f4e79;stroke-width:2}
      .p{fill:#dcfce7;stroke:#166534;stroke-width:2}.d{fill:#fef3c7;stroke:#92400e;stroke-width:2}
      .e{fill:#fee2e2;stroke:#991b1b;stroke-width:2}.f{stroke:#333;stroke-width:2;marker-end:url(#arrow)}
      .tb{fill:none;stroke:#6b7280;stroke-width:2;stroke-dasharray:8 6}
    </style>
  </defs>
  <rect width="1400" height="900" fill="white"/>
  <text x="40" y="45" style="font:bold 26px Arial,sans-serif;fill:#111">NodeGoat 1.3.0 - Data Flow Diagram (DFD)</text>
  <text x="40" y="72" class="s">Trust boundaries are dashed. Flows are labelled with the data crossing the boundary.</text>

  <rect x="30" y="100" width="230" height="650" rx="10" class="tb"/>
  <text x="45" y="125" class="s">External / Internet boundary</text>
  <rect x="60" y="170" width="160" height="80" rx="8" class="e"/>
  <text x="80" y="205" class="t">End user</text><text x="80" y="228" class="s">browser client</text>
  <rect x="60" y="330" width="160" height="80" rx="8" class="e"/>
  <text x="80" y="365" class="t">Administrator</text><text x="80" y="388" class="s">browser client</text>
  <rect x="60" y="520" width="160" height="90" rx="8" class="e"/>
  <text x="80" y="555" class="t">Third-party</text><text x="80" y="578" class="t">stock API</text><text x="80" y="600" class="s">external HTTP</text>

  <rect x="290" y="100" width="820" height="650" rx="10" class="tb"/>
  <text x="305" y="125" class="s">Application trust boundary (Express process)</text>
  <rect x="330" y="190" width="220" height="90" rx="8" class="b"/>
  <text x="350" y="225" class="t">HTTP server / routes</text><text x="350" y="248" class="s">express, session middleware</text>
  <rect x="610" y="190" width="230" height="90" rx="8" class="p"/>
  <text x="630" y="225" class="t">Auth + authorisation</text><text x="630" y="248" class="s">isLoggedIn, isAdmin</text>
  <rect x="900" y="190" width="180" height="90" rx="8" class="p"/>
  <text x="920" y="225" class="t">Controllers</text><text x="920" y="248" class="s">profile, benefits, research</text>
  <rect x="430" y="390" width="240" height="90" rx="8" class="p"/>
  <text x="450" y="425" class="t">Data access objects</text><text x="450" y="448" class="s">user, allocations, memos DAOs</text>
  <rect x="740" y="390" width="250" height="90" rx="8" class="p"/>
  <text x="760" y="425" class="t">Config / secrets</text><text x="760" y="448" class="s">env files, cookie/crypto keys</text>
  <rect x="470" y="560" width="260" height="90" rx="8" class="d"/>
  <text x="490" y="595" class="t">MongoDB</text><text x="490" y="618" class="s">users, allocations, memos</text>
  <rect x="820" y="560" width="230" height="90" rx="8" class="d"/>
  <text x="840" y="595" class="t">Console / error log</text><text x="840" y="618" class="s">stack traces, events</text>

  <line x1="220" y1="210" x2="330" y2="230" class="f"/><text x="225" y="200" class="s">credentials, forms, cookies</text>
  <line x1="220" y1="370" x2="330" y2="255" class="f"/><text x="225" y="350" class="s">admin session cookie</text>
  <line x1="550" y1="235" x2="610" y2="235" class="f"/><text x="555" y="225" class="s">session userId</text>
  <line x1="840" y1="235" x2="900" y2="235" class="f"/><text x="845" y="225" class="s">role check</text>
  <line x1="990" y1="280" x2="550" y2="390" class="f"/><text x="730" y="320" class="s">user input, $where, updates</text>
  <line x1="550" y1="480" x2="560" y2="560" class="f"/><text x="450" y="525" class="s">queries / plaintext passwords</text>
  <line x1="740" y1="435" x2="670" y2="435" class="f"/><text x="680" y="425" class="s">keys</text>
  <line x1="990" y1="435" x2="900" y2="435" class="f"/><text x="905" y="425" class="s">errors</text>
  <line x1="930" y1="605" x2="1060" y2="605" class="f"/><text x="950" y="595" class="s">stack traces debug data</text>
  <line x1="220" y1="565" x2="900" y2="250" class="f" stroke-dasharray="5 5"/><text x="430" y="500" class="s">research: user-controlled URL + symbol (SSRF); response body reflected</text>
  <line x1="1080" y1="235" x2="400" y2="235" class="f" stroke-dasharray="5 5"/><text x="720" y="175" class="s">rendered API content / redirect targets</text>

  <rect x="1140" y="100" width="230" height="650" rx="10" class="tb"/>
  <text x="1155" y="125" class="s">Legend</text>
  <rect x="1160" y="160" width="28" height="20" class="e"/><text x="1200" y="176" class="s">External entity</text>
  <rect x="1160" y="210" width="28" height="20" class="p"/><text x="1200" y="226" class="s">Process</text>
  <rect x="1160" y="260" width="28" height="20" class="d"/><text x="1200" y="276" class="s">Data store</text>
  <text x="1160" y="340" class="s">T1 Spoofing - credentials/session</text>
  <text x="1160" y="375" class="s">T2 Tampering - CSRF/XSS</text>
  <text x="1160" y="410" class="s">T3 Repudiation - weak audit</text>
  <text x="1160" y="445" class="s">T4 Info disclosure - secrets</text>
  <text x="1160" y="480" class="s">T5 DoS - ReDoS/SSRF</text>
  <text x="1160" y="515" class="s">T6 Elevation - admin routes</text>
  <text x="1160" y="550" class="s">T7 Tampering - NoSQL injection</text>
  <text x="1160" y="585" class="s">T8 Info disclosure - redirect</text>
  <text x="40" y="800" class="s">Generated from reviewed source, commit c5cb68a7084e4ae7dcc60e6a98768720a81841e8. No credentials or secrets shown.</text>
</svg>